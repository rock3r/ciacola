[versions]
antlr-kotlin = "1.0.13"
compose-jb = "1.12.0"
compose-hot-reload = "1.2.0"
jewel = "0.41.0-262.10968.63"
intellij-icons = "262.10968.63"
kotlin = "2.4.10"
ktor = "3.5.2"
collection = "1.6.0"
# TextMate parsing dependencies for JVM
# # Eclipse T4ME + Transitive dependencies
t4me = "0.18.1-SNAPSHOT"
jdt-annotations = "2.4.100"
joni = "2.2.7"
jcodings = "1.0.64"
annotations = "26.1.0"
filekit = "0.15.0"

[plugins]
antlr-kotlin = { id = "com.strumenta.antlr-kotlin", version.ref = "antlr-kotlin" }
binaryCompatibilityValidator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version = "0.18.1" }
compose = { id = "org.jetbrains.compose", version.ref = "compose-jb" }
dokka = { id = "org.jetbrains.dokka", version = "2.2.0" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-plugin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
antlr-kotlin-runtime = { module = "com.strumenta:antlr-kotlin-runtime", version.ref = "antlr-kotlin" }
compose-materialIcons = { module = "org.jetbrains.compose.material:material-icons-core", version = "1.7.3" }
compose-hotReload-runtimeApi = { module = "org.jetbrains.compose.hot-reload:hot-reload-runtime-api", version.ref = "compose-hot-reload" }
jewel-int-ui-standalone = { module = "org.jetbrains.jewel:jewel-int-ui-standalone", version.ref = "jewel" }
intellij-icons = { module = "com.jetbrains.intellij.platform:icons", version.ref = "intellij-icons" }
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
filekit-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version = "0.5.2" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
ktor-client = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-engine-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-engine-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version = "3.0.8" }
androidx-collection = { module = "androidx.collection:collection", version.ref = "collection" }
# TextMate parsing dependencies for JVM
# # Eclipse T4ME + Transitive dependencies
eclipse-t4me-core = { module = "org.eclipse:org.eclipse.tm4e.core", version.ref = "t4me" }
eclipse-jdt-annotations = { module = "org.eclipse.jdt:org.eclipse.jdt.annotation", version.ref = "jdt-annotations" }
jruby-joni = { module = "org.jruby.joni:joni", version.ref = "joni" }
jruby-jcodings = { module = "org.jruby.jcodings:jcodings", version.ref = "jcodings" }
